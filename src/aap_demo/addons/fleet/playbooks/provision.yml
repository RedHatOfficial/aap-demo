---
# namespace, nodes, images, ssh_public_key, state, scope, replicas,
# disk_size, and storage_class come from extra-vars.
# Nothing here hardcodes the namespace. An empty storage_class uses the
# cluster default StorageClass.
- name: Fleet nodes
  hosts: localhost
  connection: local
  gather_facts: false
  # state and scope come from extra-vars. Defaulting a variable to itself
  # is a recursive template, so this play does not set those names.
  vars:
    # systemd is PID 1 in each node. fleet.target is the boot target and
    # starts only fleet-setup, which restores /etc and then starts
    # multi-user.target, so no service starts with the image's /etc. It also
    # saves /etc at every shutdown.
    fleet_units:
      fleet-setup.service: |
        [Unit]
        Description=aap-demo Fleet node setup
        Before=sshd.service ssh.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/bash /entrypoint/entrypoint.sh setup
        ExecStop=/bin/bash /entrypoint/entrypoint.sh save
        StandardOutput=journal+console
        StandardError=journal+console
        TimeoutStartSec=15min
      fleet.target: |
        [Unit]
        Description=aap-demo Fleet node
        Wants=fleet-setup.service
        After=fleet-setup.service
        AllowIsolate=yes
  tasks:
    - name: Fleet node service account  # noqa: jinja[invalid]
      when: scope == 'all' and state == 'present'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: fleet-node
            namespace: "{{ namespace }}"
          automountServiceAccountToken: false

    - name: Pull secret  # noqa: jinja[invalid]
      when: state == 'present' and (pull_secret_path | default('') | length) > 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/dockerconfigjson
          metadata:
            name: pull-secret
            namespace: "{{ namespace }}"
          data:
            .dockerconfigjson: "{{ lookup('file', pull_secret_path) | b64encode }}"

    - name: SSH public key  # noqa: jinja[invalid]
      when: state == 'present'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: fleet-ssh
            namespace: "{{ namespace }}"
          stringData:
            ssh-publickey: "{{ ssh_public_key }}"

    - name: Entrypoint  # noqa: jinja[invalid]
      when: state == 'present'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: fleet-entrypoint
            namespace: "{{ namespace }}"
          data:
            entrypoint.sh: "{{ lookup('file', entrypoint_path) }}"
            fleet-setup.service: "{{ fleet_units['fleet-setup.service'] }}"
            fleet.target: "{{ fleet_units['fleet.target'] }}"

    - name: Node disk  # noqa: jinja[invalid]
      when: state == 'present' or scope == 'node'
      vars:
        disk_body:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/name: fleet-node
              app.kubernetes.io/instance: "{{ item.name }}"
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "{{ disk_size | default('2Gi') }}"
        disk_class: >-
          {{
            {'spec': {'storageClassName': storage_class}}
            if (storage_class | default('') | length) > 0
            else {}
          }}
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition: "{{ disk_body | combine(disk_class, recursive=True) }}"
      loop: "{{ nodes }}"

    - name: Node deployment  # noqa: jinja[invalid]
      when:
        - state == 'absent' or (replicas | default(1) | int) != 0
        - state == 'present' or scope == 'node'
      kubernetes.core.k8s:
        state: "{{ state }}"
        force: false
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/name: fleet-node
              app.kubernetes.io/instance: "{{ item.name }}"
          spec:
            # Keep this Kubernetes integer literal. A Jinja expression here
            # is serialized by the AAP execution environment as a string.
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app.kubernetes.io/name: fleet-node
                app.kubernetes.io/instance: "{{ item.name }}"
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: fleet-node
                  app.kubernetes.io/instance: "{{ item.name }}"
                  aap-demo/os: "{{ item.os }}"
                annotations:
                  aap-demo/fleet-ssh-key: "{{ ssh_public_key | hash('sha256') }}"
                  aap-demo/fleet-entrypoint: "{{ lookup('file', entrypoint_path) | hash('sha256') }}"
                  aap-demo/fleet-units: "{{ fleet_units | to_json | hash('sha256') }}"
              spec:
                serviceAccountName: fleet-node
                automountServiceAccountToken: false
                restartPolicy: Always
                initContainers:
                  - name: seed
                    image: "{{ images[item.os] }}"
                    securityContext:
                      runAsUser: 0
                    command:
                      - /bin/bash
                      - /entrypoint/entrypoint.sh
                      - seed
                    volumeMounts:
                      - name: entrypoint
                        mountPath: /entrypoint
                      - name: disk
                        mountPath: /mnt/disk
                containers:
                  - name: node
                    image: "{{ images[item.os] }}"
                    securityContext:
                      readOnlyRootFilesystem: false
                      runAsUser: 0
                      capabilities:
                        add:
                          - SYS_CHROOT
                          - AUDIT_WRITE
                    # CRI-O sets up a systemd container only when the command
                    # is init itself, so the setup runs as a unit, not a wrapper.
                    command:
                      - /sbin/init
                      - --unit=fleet.target
                    lifecycle:
                      # systemd ignores SIGTERM. SIGRTMIN+3 is a clean halt.
                      preStop:
                        exec:
                          command:
                            - /bin/sh
                            - -c
                            - kill -s RTMIN+3 1
                    ports:
                      - containerPort: 22
                    readinessProbe:
                      tcpSocket:
                        port: 22
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      failureThreshold: 30
                    volumeMounts:
                      - name: entrypoint
                        mountPath: /entrypoint
                      - name: units
                        mountPath: /etc/systemd/system/fleet-setup.service
                        subPath: fleet-setup.service
                      - name: units
                        mountPath: /etc/systemd/system/fleet.target
                        subPath: fleet.target
                      - name: ssh
                        mountPath: /etc/fleet
                      - name: disk
                        mountPath: /usr
                        subPath: usr
                      - name: disk
                        mountPath: /var
                        subPath: var
                volumes:
                  - name: entrypoint
                    configMap:
                      name: fleet-entrypoint
                      defaultMode: 0755
                  - name: units
                    configMap:
                      name: fleet-entrypoint
                      defaultMode: 0644
                      items:
                        - key: fleet-setup.service
                          path: fleet-setup.service
                        - key: fleet.target
                          path: fleet.target
                  - name: ssh
                    secret:
                      secretName: fleet-ssh  # pragma: allowlist secret
                      items:
                        - key: ssh-publickey
                          path: authorized_keys
                  - name: disk
                    persistentVolumeClaim:
                      claimName: "{{ item.name }}"
      loop: "{{ nodes }}"

    - name: Stop node deployments  # noqa: jinja[invalid]
      when: state == 'present' and (replicas | default(1) | int) == 0
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: "{{ item.name }}"
        namespace: "{{ namespace }}"
        replicas: 0
        wait: true
      loop: "{{ nodes }}"

    - name: Node service  # noqa: jinja[invalid]
      when: state == 'present' or scope == 'node'
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/name: fleet-node
              app.kubernetes.io/instance: "{{ item.name }}"
          spec:
            selector:
              app.kubernetes.io/name: fleet-node
              app.kubernetes.io/instance: "{{ item.name }}"
            ports:
              - port: 22
                targetPort: 22
      loop: "{{ nodes }}"
