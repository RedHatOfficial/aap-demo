# How credentials are stored — never the credentials themselves. Design §5.5.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "aap-demo/secrets"
type: object
additionalProperties: false
title: Secrets
properties:
  backend:
    type: string
    enum: [auto, none]
    default: auto
    title: Credential backend
    description: >-
      auto resolves the OS keyring lazily and fails loudly when none is available;
      it never falls back to a file. none disables credential storage outright.
    x-cli: false
    x-config: secrets.backend
    x-gui: {group: secrets, widget: select}
    x-order: 10
