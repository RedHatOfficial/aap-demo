---
name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  macos-portability:
    name: macOS Bash and checkpoint tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test prerequisites
        run: brew install jq rsync shellcheck
      - name: Validate macOS scripts without a live CRC VM
        shell: bash
        run: |
          /bin/bash test/test-install.sh
          /bin/bash test/test-crc-storage.sh
          /bin/bash test/test-start.sh
          /bin/bash test/test-macos-state.sh
          shellcheck --severity=warning install.sh includes/state-service.sh scripts/aap-demo-macos-state.sh

  windows-portability:
    name: Windows PowerShell syntax and isolated tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem powershell,test -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Write-Output; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Run isolated Windows platform tests
        shell: powershell
        run: .\test\test-windows-platform.ps1
      - name: Run isolated Windows dashboard tests
        shell: powershell
        run: .\test\test-windows-dashboard.ps1
      - name: Run isolated PowerShell 7 platform tests
        shell: pwsh
        run: .\test\test-windows-platform.ps1
      - name: Run isolated PowerShell 7 dashboard tests
        shell: pwsh
        run: .\test\test-windows-dashboard.ps1

  syntax-check:
    name: Shell Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify shell script syntax
        shell: bash
        run: |
          EXIT_CODE=0
          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            if ! bash -n "$script"; then
              echo "::error file=$script::Syntax error in $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -type f -print0)
          exit $EXIT_CODE

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cold-state test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq qemu-utils rsync libxml2-utils

      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi

      - name: Run all non-live unit tests
        run: ./test/run-unit-tests.sh

      - name: Run plaibook EE CI configuration test
        run: bash ./test/test-plaibook-ee-ci.sh

      - name: Run plaibook publication verdict test
        run: bash ./test/test-plaibook-publication.sh

      - name: Run AO PR testing model configuration test
        run: bash ./test/test-ao-pr-testing-model.sh

  dry-run:
    name: Dry Run Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test help command
        run: |
          chmod +x aap-demo.sh
          ./aap-demo.sh help

      - name: Test version/info commands
        run: |
          ./aap-demo.sh version || true
          ./aap-demo.sh status --dry-run || true

  validate-scripts:
    name: Validate Script Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check executable bits
        run: |
          EXIT_CODE=0
          # Find shell scripts with shebangs
          while read -r script; do
            if head -n 1 "$script" | grep -q '^#!'; then
              if [ ! -x "$script" ]; then
                echo "::error file=$script::Script has shebang but is not executable"
                EXIT_CODE=1
              fi
            fi
          done < <(find . -name "*.sh" -type f)
          exit $EXIT_CODE

  powershell-tests:
    name: PowerShell Deploy Tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Windows PowerShell 5.1 deploy tests
        shell: powershell
        run: .\test\test-powershell-deploy-prerequisites.ps1

      - name: Run PowerShell 7 deploy tests
        shell: pwsh
        run: ./test/test-powershell-deploy-prerequisites.ps1
