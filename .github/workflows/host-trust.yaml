---
name: Host Trust Tests

# Runs the ingress CA import against real Linux trust stores. These jobs change
# the runner's trust store, so tests/system is opt-in and not part of Unit.
on:
  pull_request:
    branches: [main, master, v2]
    paths:
      - 'src/aap_demo/cluster/ingress_ca.py'
      - 'src/aap_demo/exec/runner.py'
      - 'tests/system/**'
      - '.github/workflows/host-trust.yaml'
  push:
    branches: [main, master, v2]
    paths:
      - 'src/aap_demo/cluster/ingress_ca.py'
      - 'src/aap_demo/exec/runner.py'
      - 'tests/system/**'
      - '.github/workflows/host-trust.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu (system store, NSS, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AAP_DEMO_TEST_HOST_TRUST: "1"
      AAP_DEMO_TEST_REQUIRE_BROWSER: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install certutil
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3-tools

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run host trust tests
        run: python -m pytest tests/system -v -rs

  fedora:
    name: Fedora (update-ca-trust, NSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:42
    env:
      AAP_DEMO_TEST_HOST_TRUST: "1"
    steps:
      - name: Install system packages
        run: dnf install -y -q curl git nss-tools openssl python3 python3-pip sudo

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install package and test dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -e ".[dev]"

      - name: Run host trust tests
        run: /tmp/venv/bin/python -m pytest tests/system -v -rs
