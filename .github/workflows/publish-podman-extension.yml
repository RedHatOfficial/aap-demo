---
name: Publish Podman Desktop Extension

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: dev
  push:
    tags:
      - podman-desktop-extension-v*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aap-demo-podman-desktop-extension

jobs:
  publish:
    name: Build and publish OCI extension image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=AAP Demo Podman Desktop extension
            org.opencontainers.image.description=Podman Desktop extension for the local AAP Demo environment
            org.opencontainers.image.vendor=Red Hat

      - name: Build and push extension image
        uses: docker/build-push-action@v6
        with:
          context: ./podman-desktop-extension
          file: ./podman-desktop-extension/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
