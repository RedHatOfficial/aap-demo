---
name: Lint

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          wget -qO- https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /tmp
          sudo install /tmp/shellcheck /usr/local/bin/shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail
          git ls-files '*.sh' ':!.github/**' ':!docs/**' ':!*.zsh' -z \
            | xargs -0 -r shellcheck --severity=warning

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          set -euo pipefail
          git ls-files '*.yml' '*.yaml' -z | xargs -0 -r yamllint -c .yamllint

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          set -euo pipefail
          git ls-files '*.md' ':!.claude/**' ':!.github/**' -z \
            | xargs -0 -r -n 50 markdownlint --config .markdownlint.json

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: |
          pip install ansible-lint
          mkdir -p "${HOME}/.ansible/collections"
          ansible-galaxy collection install kubernetes.core:2.4.0 \
            -p "${HOME}/.ansible/collections"

      - name: Run ansible-lint
        run: |
          ansible-lint --force-color --offline

  secretlint:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          pip install 'detect-secrets==1.5.0'

      - name: Run detect-secrets
        run: ./scripts/check-secrets.sh

  shellformat:
    name: Shell Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          wget -qO /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: Run shfmt check
        run: |
          set -euo pipefail
          git ls-files '*.sh' -z | xargs -0 -r -n 50 shfmt -d -i 2 -ci -bn

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -qO- \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes YAMLs
        run: make validate-manifests

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    if: false  # Enable if Dockerfiles are added
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
