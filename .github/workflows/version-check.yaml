---
name: Version Format

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  version-format:
    name: VERSION format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify VERSION format
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a valid semver value; got: $version" >&2
            exit 1
          fi
          echo "VERSION format OK: $version"
