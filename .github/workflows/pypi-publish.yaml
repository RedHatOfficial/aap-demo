name: Publish to PyPI

# Publishes the development release that reserves the aap-demo name.
# 2.0.0.dev0 is not installed by `pip install aap-demo`.
# A later v2 commit publishes only when src/aap_demo/__init__.py changes,
# because PyPI keeps each version forever.
on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - .github/workflows/pypi-publish.yaml
      - src/aap_demo/__init__.py

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aap-demo
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
