# Pre-provisioned PVCs for operator-managed postgres and hub-redis.
# Created before the AnsibleAutomationPlatform CR so workloads use nfs-local-rwx
# without making it the cluster default StorageClass.
#
# Placeholders: aap-operator, aap (AnsibleAutomationPlatform metadata.name)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-15-aap-postgres-15-0
  namespace: aap-operator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-local-rwx
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aap-hub-redis-data
  namespace: aap-operator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-local-rwx
  resources:
    requests:
      storage: 1Gi
