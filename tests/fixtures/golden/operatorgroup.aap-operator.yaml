# OperatorGroup for AAP namespace
# Required for OLM to install operators in this namespace
#
# Placeholders substituted at runtime:
#   namespace: aap-operator -> actual namespace
#   - aap-operator -> actual namespace (targetNamespaces)
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap-operator-og
  namespace: aap-operator
spec:
  targetNamespaces:
    - aap-operator
