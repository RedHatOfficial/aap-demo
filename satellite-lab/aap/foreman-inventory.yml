---
# foreman-inventory.yml — Satellite dynamic inventory plugin config.
# Use with: ansible-inventory -i foreman-inventory.yml --graph
# or as an SCM-sourced inventory inside AAP (collection: theforeman.foreman,
# must be present in the Execution Environment).
plugin: theforeman.foreman.foreman
url: https://satellite.demo.lab
user: admin
password: CHANGE_ME              # use Ansible Vault or an AAP credential in real life
validate_certs: false
want_facts: true
want_params: true
want_hostcollections: true
host_filters: 'organization = "Demo Org"'

# Group fleet nodes by Satellite attributes (inspect available keys with:
#   ansible-inventory -i foreman-inventory.yml --host node01.demo.lab)
keyed_groups:
  - key: foreman['hostgroup_name'] | default('ungrouped') | lower | regex_replace('[^a-z0-9]', '_')
    prefix: hg
    separator: _
  - key: foreman['operatingsystem_name'] | default('unknown') | regex_replace('[^A-Za-z0-9]', '_')
    prefix: os
    separator: _
  - key: foreman['domain_name'] | default('') | lower
    prefix: domain
    separator: _

compose:
  ansible_host: foreman['ip'] | default(None)
