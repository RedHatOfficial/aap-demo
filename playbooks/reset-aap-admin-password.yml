---
- name: Reset the AAP platform admin password
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    aap_namespace: aap-operator
    aap_username: admin
    aap_gateway_deployment: aap-gateway
    aap_admin_password_secret: aap-admin-password
    aap_kubeconfig: >-
      {{
        lookup('env', 'KUBECONFIG')
        | default(lookup('env', 'HOME') ~ '/.aap-demo/kubeconfig.microshift', true)
      }}

  vars_prompt:
    - name: new_admin_password
      prompt: New AAP admin password
      private: true
      confirm: true

  pre_tasks:
    - name: Validate the reset target
      ansible.builtin.assert:
        that:
          - aap_username == 'admin'
          - aap_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        fail_msg: >-
          This playbook resets only the admin user and requires a valid
          Kubernetes namespace.

    - name: Validate the new password length
      ansible.builtin.assert:
        that:
          - new_admin_password | length >= 12
        fail_msg: The new AAP admin password must contain at least 12 characters.
        success_msg: The new password meets the minimum length requirement.

    - name: Check the kubeconfig
      ansible.builtin.stat:
        path: "{{ aap_kubeconfig }}"
      register: kubeconfig_file

    - name: Require an existing kubeconfig
      ansible.builtin.assert:
        that:
          - kubeconfig_file.stat.exists
          - kubeconfig_file.stat.isreg
        fail_msg: >-
          Kubeconfig not found at {{ aap_kubeconfig }}. Set KUBECONFIG to the
          active cluster kubeconfig and retry.

    - name: Find the AAP gateway deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - "{{ aap_gateway_deployment }}"
          - -n
          - "{{ aap_namespace }}"
          - -o
          - "jsonpath={.status.readyReplicas}"
          - --request-timeout=10s
      environment:
        KUBECONFIG: "{{ aap_kubeconfig }}"
      register: gateway_deployment
      changed_when: false
      failed_when: false

    - name: Require a ready AAP gateway
      ansible.builtin.assert:
        that:
          - gateway_deployment.rc == 0
          - gateway_deployment.stdout | default('0') | int > 0
        fail_msg: >-
          A ready {{ aap_gateway_deployment }} deployment was not found in
          namespace {{ aap_namespace }}. Run 'aap-demo status' and retry when
          AAP is healthy.

  tasks:
    - name: Reset the account and synchronize its secret
      block:
        - name: Change the platform admin password
          ansible.builtin.command:
            argv:
              - kubectl
              - exec
              - -i
              - -n
              - "{{ aap_namespace }}"
              - "deployment/{{ aap_gateway_deployment }}"
              - -c
              - api
              - --
              - /opt/aap-gateway/venv/bin/aap-gateway-manage
              - shell
              - -c
              - >-
                import sys;
                from django.contrib.auth import get_user_model;
                password = sys.stdin.read();
                assert password, 'Password must not be empty';
                user = get_user_model().objects.get(username={{ aap_username | to_json }});
                user.set_password(password);
                user.save(update_fields=['password']);
                print('AAP admin password updated')
            stdin: "{{ new_admin_password }}"
            stdin_add_newline: false
          environment:
            KUBECONFIG: "{{ aap_kubeconfig }}"
          register: password_reset
          changed_when: "'AAP admin password updated' in password_reset.stdout"
          no_log: true

        - name: Synchronize the generated-password secret
          ansible.builtin.command:
            argv:
              - kubectl
              - apply
              - -f
              - "-"
            stdin: >-
              {{
                {
                  'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {
                    'name': aap_admin_password_secret,
                    'namespace': aap_namespace
                  },
                  'type': 'Opaque',
                  'stringData': {
                    'password': new_admin_password
                  }
                } | to_json
              }}
            stdin_add_newline: false
          environment:
            KUBECONFIG: "{{ aap_kubeconfig }}"
          register: secret_sync
          changed_when: >-
            'created' in secret_sync.stdout or 'configured' in secret_sync.stdout
          no_log: true
      rescue:
        - name: Report a safe password reset failure
          ansible.builtin.fail:
            msg: >-
              The password reset or Kubernetes secret synchronization failed.
              No password was logged. Confirm the gateway is healthy with
              'aap-demo status', then rerun this playbook.

    - name: Confirm password reset
      ansible.builtin.debug:
        msg: >-
          Password reset completed for {{ aap_username }}. The
          {{ aap_admin_password_secret }} secret is synchronized for
          aap-demo status and addon wiring.
