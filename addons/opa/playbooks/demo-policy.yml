---
- name: Demo OPA Policy Enforcement
  hosts: localhost
  gather_facts: false
  vars:
    opa_server: "{{ opa_server | default('http://opa.aap-operator.svc.cluster.local:8181') }}"
    aap_host: "{{ aap_host }}"
    aap_username: "{{ aap_username }}"
    aap_password: "{{ aap_password }}"
    policy_to_demo: "{{ policy_name | default('') }}"
    target_organization: "{{ organization_name | default('Policy as Code') }}"

  tasks:
    - name: Get list of loaded policies from OPA
      ansible.builtin.uri:
        url: "{{ opa_server }}/v1/policies"
        method: GET
        validate_certs: false
      register: loaded_policies

    - name: Display available policies
      ansible.builtin.debug:
        msg: "Available policies: {{ loaded_policies.json.result | map(attribute='id') | list }}"

    - name: Validate policy selection
      ansible.builtin.fail:
        msg: "Policy '{{ policy_to_demo }}' is not loaded in OPA. Available: {{ loaded_policies.json.result | map(attribute='id') | list }}"
      when:
        - policy_to_demo != ''
        - policy_to_demo != 'REMOVE'
        - policy_to_demo not in (loaded_policies.json.result | map(attribute='id') | list)

    - name: Get organization details
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/organizations/?name={{ target_organization | urlencode }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
      register: org_lookup
      when: policy_to_demo != ''

    - name: Extract organization ID
      ansible.builtin.set_fact:
        org_id: "{{ org_lookup.json.results[0].id }}"
      when:
        - policy_to_demo != ''
        - org_lookup.json.results | length > 0

    - name: Apply policy to organization
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/organizations/{{ org_id }}/"
        method: PATCH
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        body_format: json
        body:
          opa_query_path: "aap_policy_examples/{{ policy_to_demo }}"
        validate_certs: false
      register: policy_applied
      when: policy_to_demo != ''

    - name: Display policy activation result
      ansible.builtin.debug:
        msg: |
          ✓ Policy Applied to Organization!

          Organization: {{ target_organization }}
          Policy: {{ policy_to_demo }}
          OPA Query Path: aap_policy_examples/{{ policy_to_demo }}

          This policy is now enforcing on ALL resources in the organization.
          Try creating or modifying resources in '{{ target_organization }}' to see policy enforcement.

          To remove the policy, set the policy_name survey field to 'REMOVE' and run this template again.
      when:
        - policy_to_demo != ''
        - policy_to_demo != 'REMOVE'

    - name: Remove policy from organization
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/organizations/{{ org_id }}/"
        method: PATCH
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        body_format: json
        body:
          opa_query_path: ""
        validate_certs: false
      register: policy_removed
      when: policy_to_demo == 'REMOVE'

    - name: Display policy removal result
      ansible.builtin.debug:
        msg: |
          ✓ Policy Removed from Organization!

          Organization: {{ target_organization }}

          No OPA policies are now enforcing on this organization.
      when: policy_to_demo == 'REMOVE'

    - name: Summary
      ansible.builtin.debug:
        msg: |
          Policy Demo Complete!

          {% if policy_to_demo == 'REMOVE' %}
          Removed all OPA policies from organization: {{ target_organization }}
          {% else %}
          Applied policy: {{ policy_to_demo }}
          Organization: {{ target_organization }}
          OPA Server: {{ opa_server }}

          The policy is now enforcing. Try creating/modifying resources in this organization!
          {% endif %}
      when: policy_to_demo != ''

    - name: No policy selected
      ansible.builtin.debug:
        msg: |
          No policy selected for demo.

          Available policies in OPA:
          {{ loaded_policies.json.result | map(attribute='id') | list | to_nice_yaml }}

          Run this template again and select a policy to demonstrate.
      when: policy_to_demo == ''
