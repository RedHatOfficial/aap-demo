---
- name: Publish a saved plaibook result to GitHub
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    publication_payload_raw: "{{ review_publication_payload | default('{}', true) }}"
    publication_payload: >-
      {{ publication_payload_raw
         if (publication_payload_raw is mapping)
         else (publication_payload_raw | from_json) }}
    publication_repository: "{{ github_repository | default(publication_payload.repository | default('')) }}"
    publication_number: >-
      {{ github_pull_request_number | default(publication_payload.pull_request_number | default('')) }}
    publication_token: "{{ github_token | default('', true) }}"

  tasks:
    - name: Validate the saved publication payload
      ansible.builtin.assert:
        that:
          - publication_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - publication_number | string is match('^[0-9]+$')
          - publication_payload.verdict is defined
        fail_msg: >-
          The publication-only job requires repository, pull request number, and
          a saved plaibook result payload.
      when: publication_token | length > 0

    - name: Build the stale-findings issue body
      ansible.builtin.set_fact:
        stale_findings_issue_body: |-
          <!-- aap-demo-plaibook-stale-findings -->
          ## Stale plaibook findings for PR #{{ publication_number }}

          These findings were emitted while reviewing PR #{{ publication_number }}
          (https://github.com/{{ publication_repository }}/pull/{{ publication_number }}),
          but their file paths are not present in the PR's current changed-file list.
          They are quarantined here for triage and are not presented as actionable PR
          feedback.

          {% for finding in publication_payload.stale_findings | default([]) %}
          {% set finding_file = finding.file | default(finding.path | default('unknown'), true) %}
          {% set finding_location = finding_file ~ (':' ~ finding.line if finding.line is defined else '') %}
          - **{{ finding.severity | default('unknown') | upper }}** `{{ finding_location }}`
            — {{ finding.description | default('No description provided.') }}
            - Evidence: {{ finding.evidence | default('n/a') }}
            - Suggested fix: {{ finding.fix | default('n/a') }}
          {% endfor %}

          _Generated by the aap-demo `ao-pr-testing` workflow._
      when:
        - publication_token | length > 0
        - publication_payload.stale_findings | default([]) | length > 0

    - name: Find the existing stale-findings issue
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ publication_repository }}/issues?state=open&per_page=100"
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ publication_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
        status_code: 200
        validate_certs: true
      register: github_open_issues
      changed_when: false
      no_log: true
      when:
        - publication_token | length > 0
        - publication_payload.stale_findings | default([]) | length > 0

    - name: Select the existing stale-findings issue
      ansible.builtin.set_fact:
        github_stale_issue_id: >-
          {{ (github_open_issues.json | default([])
              | selectattr('body', 'defined')
              | selectattr('body', 'search', '<!-- aap-demo-plaibook-stale-findings -->')
              | selectattr('body', 'search',
                  'https://github.com/' ~ publication_repository ~ '/pull/'
                  ~ (publication_number | string))
              | map(attribute='number') | list | first) | default(0) | int }}
      when: github_open_issues is defined

    - name: Update the stale-findings issue
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ publication_repository }}/issues/{{ github_stale_issue_id }}"
        method: PATCH
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ publication_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          title: "[aap-demo] Stale plaibook findings for PR #{{ publication_number }}"
          body: "{{ stale_findings_issue_body }}"
          state: open
        status_code: 200
        validate_certs: true
      register: github_stale_issue_write
      changed_when: true
      failed_when: false
      no_log: true
      when:
        - github_stale_issue_id | default(0) | int > 0
        - stale_findings_issue_body is defined

    - name: Create the stale-findings issue
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ publication_repository }}/issues"
        method: POST
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ publication_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          title: "[aap-demo] Stale plaibook findings for PR #{{ publication_number }}"
          body: "{{ stale_findings_issue_body }}"
        status_code: 201
        validate_certs: true
      register: github_stale_issue_write
      changed_when: true
      failed_when: false
      no_log: true
      when:
        - github_stale_issue_id | default(0) | int == 0
        - stale_findings_issue_body is defined

    - name: Capture stale-findings issue URL
      ansible.builtin.set_fact:
        github_stale_issue_url: "{{ github_stale_issue_write.json.html_url | default('') }}"
      when: github_stale_issue_write is defined

    - name: Build the marked PR review comment
      ansible.builtin.set_fact:
        review_comment_body: |-
          <!-- aap-demo-plaibook-review -->
          ## Plaibook review: {{ publication_payload.verdict | default('UNKNOWN') }}

          **Score:** {{ publication_payload.score | default('n/a') }}
          **Commit:** {{ publication_payload.commit | default('n/a') }}

          **Actionable findings in this PR:** {{ publication_payload.current_findings | default([]) | length }}

          {% for finding in publication_payload.current_findings | default([]) %}
          {% set finding_file = finding.file | default(finding.path | default('unknown'), true) %}
          {% set finding_location = finding_file ~ (':' ~ finding.line if finding.line is defined else '') %}
          - **{{ finding.severity | default('unknown') | upper }}** `{{ finding_location }}`
            — {{ finding.description | default('No description provided.') }}
            - Evidence: {{ finding.evidence | default('n/a') }}
            - Suggested fix: {{ finding.fix | default('n/a') }}
          {% else %}
          No findings matched the PR's current changed files.
          {% endfor %}

          {% if github_stale_issue_url | default('') | length > 0 %}
          Stale findings were quarantined in [this issue]({{ github_stale_issue_url }}).
          {% endif %}

          ### Live smoke checks

          **Status:** {{ publication_payload.live_smoke.status | default('not reported') }}

          {% for check_name, check in (publication_payload.live_smoke.checks | default({})).items() %}
          - `{{ check_name }}`: HTTP {{ check.status_code | default('n/a') }}
          {% endfor %}

          <details>
          <summary>Detailed current-diff findings</summary>

          <pre>{{ publication_payload.current_findings | default([]) | to_nice_json }}</pre>
          </details>

          <details>
          <summary>Review execution metadata</summary>

          <pre>{{ publication_payload.review_metadata | default({}) | to_nice_json }}</pre>
          </details>

          _Posted by the aap-demo `ao-pr-testing` workflow._
      when:
        - publication_token | length > 0
        - publication_payload.verdict is defined

    - name: Find the existing marked PR review comment
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ publication_repository }}/issues/{{ publication_number }}/comments"
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ publication_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
        status_code: 200
        validate_certs: true
      register: github_review_comments
      changed_when: false
      no_log: true
      when:
        - publication_token | length > 0
        - review_comment_body is defined

    - name: Select the existing marked PR review comment
      ansible.builtin.set_fact:
        github_review_comment_id: >-
          {{ (github_review_comments.json | default([])
              | selectattr('body', 'defined')
              | selectattr('body', 'search', '<!-- aap-demo-plaibook-review -->')
              | map(attribute='id') | list | first) | default(0) | int }}
      when: github_review_comments is defined

    - name: Update the marked PR review comment
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ publication_repository }}/issues/comments/{{ github_review_comment_id }}"
        method: PATCH
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ publication_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          body: "{{ review_comment_body }}"
        status_code: 200
        validate_certs: true
      register: github_review_comment_write
      changed_when: true
      failed_when: false
      no_log: true
      when:
        - github_review_comment_id | default(0) | int > 0
        - review_comment_body is defined

    - name: Create the marked PR review comment
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ publication_repository }}/issues/{{ publication_number }}/comments"
        method: POST
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ publication_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          body: "{{ review_comment_body }}"
        status_code: 201
        validate_certs: true
      register: github_review_comment_write
      changed_when: true
      failed_when: false
      no_log: true
      when:
        - github_review_comment_id | default(0) | int == 0
        - review_comment_body is defined

    - name: Publish publication status to AAP artifacts
      ansible.builtin.set_stats:
        per_host: false
        data:
          github_pr_comment:
            status: >-
              {{ 'posted' if (github_review_comment_write is defined
                              and github_review_comment_write.status | default(0) | int in [200, 201])
                 else 'skipped' }}
            operation: >-
              {{ 'updated' if github_review_comment_id | default(0) | int > 0
                 else ('created' if github_review_comment_write is defined else 'skipped') }}
            repository: "{{ publication_repository }}"
            pull_request_number: "{{ publication_number }}"
            http_status: "{{ github_review_comment_write.status | default(0) | int }}"
          github_stale_findings_issue:
            status: >-
              {{ 'posted' if (github_stale_issue_write is defined
                              and github_stale_issue_write.status | default(0) | int in [200, 201])
                 else ('not_needed' if publication_payload.stale_findings | default([]) | length == 0 else 'skipped') }}
            issue_url: "{{ github_stale_issue_url | default('') }}"
            finding_count: "{{ publication_payload.stale_findings | default([]) | length }}"

    - name: Fail so AO can retry publication when GitHub rejected a write
      ansible.builtin.assert:
        that:
          - >-
              {{ github_review_comment_write is not defined or
                 github_review_comment_write.skipped | default(false) | bool or
                 github_review_comment_write.status | default(0) | int in [200, 201] }}
          - >-
              {{ github_stale_issue_write is not defined or
                 github_stale_issue_write.skipped | default(false) | bool or
                 github_stale_issue_write.status | default(0) | int in [200, 201] }}
        fail_msg: >-
          GitHub publication failed; retry this publication-only node after
          correcting the credential or repository permissions.
      when:
        - publication_token | length > 0
        - publication_payload.verdict is defined
