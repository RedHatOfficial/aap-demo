apiVersion: apps/v1
kind: Deployment
metadata:
  name: eda-playground
  namespace: eda-playground
  labels:
    app: eda-playground
    app.kubernetes.io/name: eda-playground
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eda-playground
  template:
    metadata:
      labels:
        app: eda-playground
        app.kubernetes.io/name: eda-playground
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: eda-playground
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eda-playground
          image: __EDA_PLAYGROUND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: ALLOW_SELF_SIGNED_CERTS
              value: "true"
            - name: AAP_BASE_URL
              value: __EDA_PLAYGROUND_AAP_BASE_URL__
            - name: AAP_REDIRECT_URI
              value: __EDA_PLAYGROUND_REDIRECT_URI__
            - name: AAP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: eda-playground-oauth
                  key: client-id
            - name: AAP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eda-playground-oauth
                  key: client-secret
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: eda-playground-oauth
                  key: client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eda-playground-oauth
                  key: client-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: eda-playground-oauth
                  key: session-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: integrations
              mountPath: /app/integrations/custom
              readOnly: true
      volumes:
        - name: integrations
          configMap:
            name: eda-playground-integrations
            optional: true
