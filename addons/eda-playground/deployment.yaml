---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eda-playground
  namespace: eda-playground
  labels:
    app: eda-playground
    app.kubernetes.io/name: eda-playground
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eda-playground
  template:
    metadata:
      labels:
        app: eda-playground
        app.kubernetes.io/name: eda-playground
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: eda-playground-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eda-playground
          image: ghcr.io/bbgrimmett2/eda-playground:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: ALLOW_SELF_SIGNED_CERTS
              value: "true"
          envFrom:
            - secretRef:
                name: eda-playground-oauth
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: integrations
              mountPath: /app/integrations/custom
              readOnly: true
      volumes:
        - name: integrations
          configMap:
            name: eda-playground-integrations
            optional: true
