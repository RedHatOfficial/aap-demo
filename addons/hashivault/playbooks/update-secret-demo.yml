---
- name: Update Secret in HashiCorp Vault
  hosts: localhost
  gather_facts: true  # Need ansible_date_time
  vars:
    secret_path: "{{ secret_path | default('secret/data/demo') }}"
    new_api_key: "{{ new_api_key | default('updated-key-' + ansible_date_time.epoch) }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"

  tasks:
    - name: Verify Vault credentials are injected
      ansible.builtin.assert:
        that:
          - vault_addr != ''
          - vault_token != ''
        fail_msg: "Vault credentials not configured"

    - name: Read current secret (to preserve other fields)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ secret_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
        validate_certs: false
      register: current_secret

    - name: Update secret with new api_key
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ secret_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          data: "{{ current_secret.json.data.data | combine({'api_key': new_api_key, 'last_updated': ansible_date_time.iso8601}) }}"
        validate_certs: false
        status_code: 200
      register: update_response

    - name: Display update confirmation
      ansible.builtin.debug:
        msg: |
          ✓ Secret Updated Successfully

          Vault URL: {{ vault_addr }}
          Path: {{ secret_path }}
          New Version: {{ update_response.json.data.version }}

          Updated Fields:
            - api_key: {{ new_api_key }}
            - last_updated: {{ ansible_date_time.iso8601 }}

          💡 Run the 'Verify Runtime Injection' template to see the updated values!
