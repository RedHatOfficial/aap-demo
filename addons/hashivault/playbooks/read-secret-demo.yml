---
- name: Read Secret from HashiCorp Vault
  hosts: localhost
  gather_facts: false
  vars:
    secret_path: "{{ secret_path | default('secret/data/demo') }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"

  tasks:
    - name: Verify Vault credentials are injected
      ansible.builtin.assert:
        that:
          - vault_addr != ''
          - vault_token != ''
        fail_msg: |
          ❌ Vault credentials not found!
          Ensure a HashiVault credential (OIDC or Token) is attached to this job template.

    - name: Read secret from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ secret_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
        validate_certs: false
        status_code: 200
      register: vault_response
      no_log: false  # Show output for demo purposes

    - name: Parse secret data
      ansible.builtin.set_fact:
        secret_data: "{{ vault_response.json.data.data }}"

    - name: Display retrieved secrets
      ansible.builtin.debug:
        msg: |
          ✓ Secret Retrieved Successfully

          Vault URL: {{ vault_addr }}
          Path: {{ secret_path }}
          Version: {{ vault_response.json.data.metadata.version }}
          Created: {{ vault_response.json.data.metadata.created_time }}

          Secret Values:
          {% for key, value in secret_data.items() %}
            - {{ key }}: {{ value }}
          {% endfor %}

          💡 These secrets were read at JOB RUNTIME from Vault.
          They are NOT baked into the execution environment.

          Note: AAP automatically handled authentication to Vault.
          For OIDC credentials, AAP generated a short-lived JWT and
          exchanged it for a Vault token behind the scenes!
