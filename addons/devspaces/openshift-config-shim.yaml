---
# MicroShift compatibility shim for the config.openshift.io API group.
#
# WHY THIS EXISTS
# ---------------
# The DevWorkspace Operator (a hard dependency of OpenShift Dev Spaces) decides
# at process start-up whether it is running on OpenShift or vanilla Kubernetes:
#
#   pkg/infrastructure/cluster.go (v0.39.0):
#     if findAPIGroup(..., "route.openshift.io") == nil  -> Kubernetes
#     else if findAPIGroup(..., "config.openshift.io") == nil -> Unsupported
#     else -> OpenShiftv4
#
#   main.go init():
#     err := infrastructure.Initialize()
#     if err != nil { setupLog.Error(...); os.Exit(1) }
#
# MicroShift enables exactly two OpenShift API groups — route.openshift.io and
# security.openshift.io (see openshift/microshift docs/contributor/enabled_apis.md).
# config.openshift.io is NOT one of them. So detect() lands in the middle branch,
# returns Unsupported, Initialize() errors with "running on unsupported cluster",
# and init() calls os.Exit(1).
#
# Because that happens in init(), it runs BEFORE main() calls ctrl.SetLogger().
# controller-runtime's delegating logger has no sink yet, so setupLog.Error()
# writes nothing anywhere. The result is a container that exits 1 with an
# empty log, no termination message, endless CrashLoopBackOff, and an OLM CSV
# stuck in "Installing" until "deployment exceeded its progress deadline".
#
# Registering the CRDs below makes config.openshift.io appear in API discovery,
# so detect() returns OpenShiftv4 and the operator starts normally.
#
# WHAT IS INCLUDED
# ----------------
# Only the config.openshift.io resources that DevWorkspace and Che actually read,
# all of them singleton "cluster" objects with get-only RBAC:
#   - proxies         (DWO: pkg/config/proxy/openshift.go; Che)
#   - consoles        (Che)
#   - authentications (Che)
#
# Schemas use x-kubernetes-preserve-unknown-fields so we do not have to track
# the real upstream OpenShift schemas. These are stand-ins for a dev/demo
# cluster, NOT a real OpenShift config API — nothing reconciles them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proxies.config.openshift.io
  labels:
    app.kubernetes.io/part-of: aap-demo
    aap-demo.redhat.com/shim: openshift-config
spec:
  group: config.openshift.io
  scope: Cluster
  names:
    kind: Proxy
    listKind: ProxyList
    plural: proxies
    singular: proxy
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Minimal stand-in for OpenShift Proxy on MicroShift.
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consoles.config.openshift.io
  labels:
    app.kubernetes.io/part-of: aap-demo
    aap-demo.redhat.com/shim: openshift-config
spec:
  group: config.openshift.io
  scope: Cluster
  names:
    kind: Console
    listKind: ConsoleList
    plural: consoles
    singular: console
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Minimal stand-in for OpenShift Console config on MicroShift.
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authentications.config.openshift.io
  labels:
    app.kubernetes.io/part-of: aap-demo
    aap-demo.redhat.com/shim: openshift-config
spec:
  group: config.openshift.io
  scope: Cluster
  names:
    kind: Authentication
    listKind: AuthenticationList
    plural: authentications
    singular: authentication
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Minimal stand-in for OpenShift Authentication config on MicroShift.
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
