---
# Deploy Ansible automation portal with Ansible Quality (APME) via the APME operator

- name: Deploy APME automation portal
  hosts: localhost
  gather_facts: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    collection_root: "{{ playbook_dir | dirname }}"
    ansible_kubernetes_context: ~

  pre_tasks:
    - name: Debug OpenShift connection parameters
      ansible.builtin.debug:
        msg:
          - "openshift_token defined: {{ openshift_token is defined }}"
          - "openshift_api_url: {{ openshift_api_url | default('NOT SET') }}"
      when: apme_debug | default(false) | bool

    - name: Derive OpenShift cluster domain from API URL if not specified
      ansible.builtin.set_fact:
        openshift_cluster_domain: >-
          {{ openshift_cluster_domain | default(
             openshift_api_url |
             regex_replace('^https?://api\.', 'apps.') |
             regex_replace(':[0-9]+$', '')
          ) }}

    - name: Set portal route host (RHDH portal fixed hostname)
      ansible.builtin.set_fact:
        portal_route_host: "redhat-rhaap-portal-apme.{{ openshift_cluster_domain }}"
        portal_url: "https://redhat-rhaap-portal-apme.{{ openshift_cluster_domain }}"

    - name: Display deployment info
      ansible.builtin.debug:
        msg:
          - "==== Ansible Quality (APME) portal deployment (APME operator) ===="
          - "Target namespace: {{ openshift_project_name }}"
          - "Cluster domain: {{ openshift_cluster_domain }}"
          - "Portal URL (expected): {{ portal_url }}"
          - "Portal hub image: {{ portal_hub_image }}"

    - name: Verify required Ansible collections
      ansible.builtin.command:
        cmd: ansible-galaxy collection list
      register: collections_list
      changed_when: false

    - name: Fail when kubernetes.core collection is missing
      ansible.builtin.fail:
        msg: >-
          kubernetes.core collection not found.
          Use Product Demos EE (quay.io/ansible-product-demos/apd-ee-26:latest)
          or set APME_EE_IMAGE to an EE that includes kubernetes.core.
      when: "'kubernetes.core' not in collections_list.stdout"

    - name: Fail when redhat.openshift collection is missing
      ansible.builtin.fail:
        msg: >-
          redhat.openshift collection not found.
          Use Product Demos EE (quay.io/ansible-product-demos/apd-ee-26:latest)
          or set APME_EE_IMAGE to an EE that includes redhat.openshift.
      when: "'redhat.openshift' not in collections_list.stdout"

  roles:
    - role: apme_pah_integration
    - role: aap_apme_prerequisites
    - role: apme_template_deploy
    - role: apme_scm_secrets
      when: configure_github_app_secrets | default(false) | bool
    - role: apme_template_deploy
      tasks_from: github_app_wiring.yml
      when: configure_github_app_secrets | default(false) | bool

  post_tasks:
    - name: Seed APME galaxy servers from AAP and setup-pah credentials
      ansible.builtin.include_role:
        name: apme_pah_integration
        tasks_from: seed_apme_galaxy_servers.yml

    - name: Save deployment info
      ansible.builtin.template:
        src: deployment-info.md.j2
        dest: >-
          {{ collection_root }}/apme-portal-deployment-{{
          ansible_date_time.year }}-{{ ansible_date_time.month }}-{{
          ansible_date_time.day }}-{{ ansible_date_time.hour }}{{
          ansible_date_time.minute }}.md
        mode: "0644"
      changed_when: false

    - name: Display deployment complete
      ansible.builtin.debug:
        msg:
          - ""
          - "============================================"
          - "  APME Portal Deployment Complete"
          - "============================================"
          - ""
          - "Portal URL: {{ portal_url }}"
          - "Namespace: {{ openshift_project_name }}"
          - "Portal hub: {{ portal_hub_image }}"
          - "Install method: APME operator (portal/deploy.yaml + Apme custom resource)"
          - ""
          - "Verify: oc get pods -n {{ openshift_project_name }}"
          - "Sign in via AAP OAuth, then open Quality tab after registering a repo."
          - ""
