---
# Install apme gateway Helm release in the same namespace as the portal
# NOTE: Released versions (2026.7.3) only support x86_64
# ARM64 support available in SHA builds (sha-d1ac741 and later)

- name: Validate APME gateway values file  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ apme_gateway_helm_values_file }}"
  register: apme_values_stat

- name: Fail when apme-values.yaml is missing  # noqa: var-naming[no-role-prefix]
  ansible.builtin.fail:
    msg: "APME gateway values file not found: {{ apme_gateway_helm_values_file }}"
  when: not apme_values_stat.stat.exists

- name: List storage classes for block SC detection  # noqa: var-naming[no-role-prefix]
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    api_key: "{{ openshift_token | default(omit) }}"
    kubeconfig: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(omit) }}"
    host: "{{ openshift_api_url }}"
    validate_certs: "{{ apme_gateway_helm_validate_certs }}"
  register: all_storage_classes
  when: apme_gateway_storage_class is not defined

- name: Select non-NFS block storage class for gateway SQLite PVC  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    apme_gateway_storage_class: >-
      {{ all_storage_classes.resources
         | rejectattr('provisioner', 'search', 'nfs')
         | map(attribute='metadata.name')
         | first }}
  when:
    - apme_gateway_storage_class is not defined
    - all_storage_classes.resources | rejectattr('provisioner', 'search', 'nfs') | list | length > 0

- name: Display gateway storage class  # noqa: var-naming[no-role-prefix]
  ansible.builtin.debug:
    msg: "Gateway PVC storageClass: {{ apme_gateway_storage_class | default('(cluster default)') }}"

- name: Install or upgrade APME gateway Helm release from latest chart  # noqa: var-naming[no-role-prefix]
  block:
    - name: Install or upgrade APME gateway Helm release  # noqa: var-naming[no-role-prefix]
      kubernetes.core.helm:
        name: "{{ apme_helm_release_name }}"
        chart_ref: "{{ apme_helm_chart_name }}"
        chart_repo_url: "{{ apme_helm_chart_repo_url }}"
        chart_version: "{{ apme_helm_chart_version | default(omit, true) }}"
        release_namespace: "{{ openshift_project_name }}"
        create_namespace: false
        values_files:
          - "{{ apme_gateway_helm_values_file }}"
        values: >-
          {{
            {'persistence': {'gateway': {'storageClass': apme_gateway_storage_class}}}
            if apme_gateway_storage_class is defined and apme_gateway_storage_class | length > 0
            else {}
          }}
        wait: true
        wait_timeout: "{{ apme_gateway_helm_timeout }}s"
        api_key: "{{ openshift_token | default(omit) }}"
        kubeconfig: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(omit) }}"
        host: "{{ openshift_api_url }}"
        validate_certs: "{{ apme_gateway_helm_validate_certs }}"
      environment:
        PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"  # yamllint disable-line rule:line-length
        HELM_CACHE_HOME: "/tmp/.helm/cache"
        HELM_CONFIG_HOME: "/tmp/.helm/config"
        HELM_DATA_HOME: "/tmp/.helm/data"
      register: apme_gateway_helm_result
  rescue:
    - name: Report latest APME chart failure  # noqa: var-naming[no-role-prefix]
      ansible.builtin.debug:
        msg: >-
          Latest APME chart installation failed; retrying with pinned fallback
          chart {{ apme_helm_chart_fallback_version | default('(not configured)') }}.

    - name: Fail when APME fallback chart is not configured  # noqa: var-naming[no-role-prefix]
      ansible.builtin.fail:
        msg: "Latest APME chart failed and no fallback chart version is configured."
      when: >-
        apme_helm_chart_fallback_version is not defined or
        apme_helm_chart_fallback_version | length == 0

    - name: Install or upgrade APME gateway Helm release with pinned fallback  # noqa: var-naming[no-role-prefix]
      kubernetes.core.helm:
        name: "{{ apme_helm_release_name }}"
        chart_ref: "{{ apme_helm_chart_name }}"
        chart_repo_url: "{{ apme_helm_chart_repo_url }}"
        chart_version: "{{ apme_helm_chart_fallback_version }}"
        release_namespace: "{{ openshift_project_name }}"
        create_namespace: false
        values_files:
          - "{{ apme_gateway_helm_values_file }}"
        values: >-
          {{
            {'persistence': {'gateway': {'storageClass': apme_gateway_storage_class}}}
            if apme_gateway_storage_class is defined and apme_gateway_storage_class | length > 0
            else {}
          }}
        wait: true
        wait_timeout: "{{ apme_gateway_helm_timeout }}s"
        api_key: "{{ openshift_token | default(omit) }}"
        kubeconfig: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(omit) }}"
        host: "{{ openshift_api_url }}"
        validate_certs: "{{ apme_gateway_helm_validate_certs }}"
      environment:
        PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"  # yamllint disable-line rule:line-length
        HELM_CACHE_HOME: "/tmp/.helm/cache"
        HELM_CONFIG_HOME: "/tmp/.helm/config"
        HELM_DATA_HOME: "/tmp/.helm/data"
      register: apme_gateway_helm_result
