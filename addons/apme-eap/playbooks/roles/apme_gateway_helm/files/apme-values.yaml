---
# APME gateway — EAP install (same namespace as portal)
# APME chart 0.1.8 / application release 2026.9.3.
image:
  registry: ghcr.io/ansible
  tag: "2026.9.3"

# OpenShift uses the restricted SCC to assign pod security settings.
platform: openshift

# Reduce resource requests for OpenShift Local / smaller clusters
engine:
  resources:
    engine:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    native:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    opa:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ansible:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    gitleaks:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    collectionHealth:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    depAudit:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    galaxyProxy:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Reduce PVC sizes for OpenShift Local / smaller clusters
persistence:
  sessions:
    size: 2Gi
  gateway:
    size: 2Gi
  proxyCache:
    size: 2Gi
  postgres:
    size: 2Gi

postgres:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  enabled: false
