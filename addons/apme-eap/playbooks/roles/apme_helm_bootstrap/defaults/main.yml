---
# Helm is not included in the standard AAP execution environment. Download a
# pinned client into the job's writable /tmp area so kubernetes.core.helm can
# run entirely inside AAP.

apme_helm_version: "3.15.4"
apme_helm_install_dir: "/tmp/apme-helm"
apme_helm_binary: "{{ apme_helm_install_dir }}/helm"
# The role resolves this for the control host before downloading. Keep a
# Linux fallback so the defaults remain renderable when inspected standalone.
apme_helm_platform: linux-amd64
apme_helm_archive: >-
  /tmp/helm-v{{ apme_helm_version }}-{{ apme_helm_platform }}.tar.gz
apme_helm_download_url: >-
  https://get.helm.sh/helm-v{{ apme_helm_version }}-{{ apme_helm_platform }}.tar.gz
