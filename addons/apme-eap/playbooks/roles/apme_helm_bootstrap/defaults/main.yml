---
# Helm is not included in the standard AAP execution environment. Download a
# pinned client into the job's writable /tmp area so kubernetes.core.helm can
# run entirely inside AAP.

apme_helm_version: "3.15.4"  # noqa: var-naming[no-role-prefix]
apme_helm_install_dir: "/tmp/apme-helm"  # noqa: var-naming[no-role-prefix]
apme_helm_binary: "{{ apme_helm_install_dir }}/helm"  # noqa: var-naming[no-role-prefix]
apme_helm_os: >-
  {{ 'darwin' if (ansible_system | default('Linux') | lower) == 'darwin' else 'linux' }}
apme_helm_architecture: >-
  {{ 'arm64' if ansible_architecture | default('x86_64') in ['aarch64', 'arm64'] else 'amd64' }}
apme_helm_archive: >-
  /tmp/helm-v{{ apme_helm_version }}-{{ apme_helm_os }}-{{ apme_helm_architecture }}.tar.gz  # noqa: var-naming[no-role-prefix]
apme_helm_download_url: >-
  https://get.helm.sh/helm-v{{ apme_helm_version }}-{{ apme_helm_os }}-{{ apme_helm_architecture }}.tar.gz  # noqa: var-naming[no-role-prefix]
