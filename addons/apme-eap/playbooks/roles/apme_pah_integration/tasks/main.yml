---
# Detect setup-pah credentials, configure AAP hub remotes, set facts for Helm + APME seeding.

- name: Check for console.redhat.com galaxy offline token  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ apme_pah_galaxy_token_file }}"
  register: apme_pah_galaxy_token_stat
  delegate_to: localhost
  become: false
  when: apme_pah_has_galaxy_token is not defined

- name: Check for external PAH config file  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ apme_pah_config_file }}"
  register: apme_pah_config_stat
  delegate_to: localhost
  become: false
  when: apme_pah_has_pah_config is not defined

- name: Set credential availability facts  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    apme_pah_has_galaxy_token: >-
      {{ apme_pah_has_galaxy_token | default(
         apme_pah_galaxy_token_stat.stat.exists | default(false)) }}
    apme_pah_has_pah_config: >-
      {{ apme_pah_has_pah_config | default(
         apme_pah_config_stat.stat.exists | default(false)) }}
    apme_pah_credentials_available: >-
      {{ (apme_pah_has_galaxy_token | default(
           apme_pah_galaxy_token_stat.stat.exists | default(false)) | bool)
         or (apme_pah_has_pah_config | default(
           apme_pah_config_stat.stat.exists | default(false)) | bool) }}

- name: Load external PAH config when present  # noqa: var-naming[no-role-prefix]
  ansible.builtin.slurp:
    src: "{{ apme_pah_config_file }}"
  register: apme_pah_config_slurp
  delegate_to: localhost
  become: false
  when:
    - apme_pah_has_pah_config | default(false) | bool
    - apme_pah_external_url is not defined

- name: Parse external PAH config  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    apme_pah_external_url: "{{ (apme_pah_config_slurp.content | b64decode | from_yaml).url | default('') | trim }}"
    apme_pah_external_token: "{{ (apme_pah_config_slurp.content | b64decode | from_yaml).token | default('') | trim }}"
  when:
    - apme_pah_has_pah_config | default(false) | bool
    - apme_pah_external_url is not defined
  no_log: true

- name: Warn when setup-pah credentials are missing  # noqa: var-naming[no-role-prefix]
  ansible.builtin.debug:
    msg: >-
      No ~/.aap-demo/galaxy-token or pah-config.yml found — skipping setup-pah.
      Portal will still use AAP Automation Hub via ansible.rhaap; run
      `aap-demo enable setup-pah` to sync rh-certified collections.
  when: not (apme_pah_credentials_available | bool)

- name: Configure AAP Private Automation Hub remotes (setup-pah)  # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    cmd: "{{ apme_pah_setup_script }}"
  environment:
    NAMESPACE: "{{ apme_pah_aap_namespace }}"
    GALAXY_TOKEN_FILE: "{{ apme_pah_galaxy_token_file }}"
    PAH_CONFIG_FILE: "{{ apme_pah_config_file }}"
    KUBECONFIG: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG'), true) }}"
  register: apme_pah_setup_result
  changed_when: apme_pah_setup_result.rc == 0
  failed_when: apme_pah_setup_result.rc != 0
  when:
    - apme_pah_run_setup_pah | bool
    - apme_pah_has_galaxy_token | default(false) | bool

- name: Display setup-pah result  # noqa: var-naming[no-role-prefix]
  ansible.builtin.debug:
    msg: "{{ apme_pah_setup_result.stdout_lines | default([]) }}"
  when:
    - apme_pah_setup_result is defined
    - apme_pah_setup_result is not skipped

- name: Resolve PAH catalog sync enablement  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    apme_pah_collections_sync_enabled: >-
      {{
        (apme_pah_collections_enabled | string == 'true')
        or (
          (apme_pah_collections_enabled | string == 'auto')
          and (apme_pah_credentials_available | bool)
        )
      }}

- name: Display PAH integration summary  # noqa: var-naming[no-role-prefix]
  ansible.builtin.debug:
    msg:
      - "setup-pah credentials: {{ 'yes' if apme_pah_credentials_available else 'no' }}"
      - "PAH catalog sync (pahCollections): {{ apme_pah_collections_sync_enabled }}"
      - "APME galaxy-server seeding: {{ apme_pah_seed_apme_galaxy_servers }}"
