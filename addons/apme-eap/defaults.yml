---
# APME Playbook Addon - Default Configuration

openshift_project_name: apme

portal_helm_release_name: redhat-rhaap-portal

aap_organization: Default
aap_apme_prerequisites_oauth_application_name: "APME Portal OAuth"

configure_github_secrets: false
configure_github_app_secrets: false

portal_hub_image: "quay.io/cferman/portal-hub-eap:latest"

apme_pah_run_setup_pah: true
apme_pah_seed_apme_galaxy_servers: true
apme_pah_collections_enabled: auto
apme_pah_aap_namespace: aap-operator

apme_skip_openshift_secret_creation: true
apme_template_release_name: redhat-rhaap-portal
apme_exclude_apme_plugins: false
apme_use_operator: true
apme_operator_version: v0.1.0
apme_operator_name: apme
apme_operator_image_tag: 2026.8.10
apme_operator_image_registry: quay.io/ansible
apme_operator_pull_secrets: []

apme_route_tls_enabled: false
apme_route_tls_termination: edge

apme_debug: false
