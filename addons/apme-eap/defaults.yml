---
# APME Playbook Addon - Default Configuration
# These values are used as defaults and can be overridden in the generated vars file

# Namespace (fixed for aap-demo)
openshift_project_name: apme

# Helm chart configuration (Red Hat Developer Hub / Portal)
portal_helm_chart_repo: openshift-helm-charts
portal_helm_chart_repo_url: https://charts.openshift.io/
portal_helm_chart_name: redhat-rhaap-portal
portal_helm_chart_version: 2.2.3
portal_helm_release_name: redhat-rhaap-portal
portal_helm_install_timeout: 1800

# Helm chart configuration (APME gateway - x86 only)
apme_helm_chart_repo: apme
apme_helm_chart_repo_url: https://ansible.github.io/apme
apme_helm_chart_name: apme
apme_helm_chart_version: 0.1.2
apme_helm_release_name: apme

# AAP organization (create or reuse)
aap_organization: Default
aap_apme_prerequisites_oauth_application_name: "APME Portal OAuth"

# GitHub secrets configuration
configure_github_secrets: false

# Portal hub image (APME plugins baked in at build time — no deploy-time plugin loading)
portal_hub_image: "quay.io/cferman/portal-hub-eap:latest"

# setup-pah / Automation Hub integration (see ~/.aap-demo/galaxy-token and pah-config.yml)
apme_pah_run_setup_pah: true
apme_pah_seed_apme_galaxy_servers: true
apme_pah_collections_enabled: auto
apme_pah_aap_namespace: aap-operator

# OpenShift DevSpaces (optional)
# Set to enable "Open in DevSpaces" actions after remediation
# devspaces_base_url: "https://devspaces.apps.cluster.example.com/"
