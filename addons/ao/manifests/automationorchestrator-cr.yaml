# The AutomationOrchestrator instance aap-demo applies after the operator's
# Subscription succeeds. Fields follow the CRD (kubectl explain
# automationorchestrator.spec). The postgres block points at the StatefulSet in
# postgres.yaml (ADR-043).
#
# Placeholders substituted by deploy.sh:
#   __NAMESPACE__         -> automation-orchestrator
#   __INGRESS_HOST__      -> route hostname
#   __PULL_SECRET_NAME__  -> registry pull secret
#   __AO_REPLICA_COUNT__  -> 1 (default) or 2
---
apiVersion: aap.ansible.com/v1alpha1
kind: AutomationOrchestrator
metadata:
  name: automation-orchestrator
  namespace: __NAMESPACE__
spec:
  imagePullSecrets:
    - name: __PULL_SECRET_NAME__
  backend:
    replicas: __AO_REPLICA_COUNT__
  ui:
    replicas: __AO_REPLICA_COUNT__
  worker:
    replicas: __AO_REPLICA_COUNT__
  secrets:
    # Explicit reference lets aap-demo restore the bootstrap password before
    # the CR exists without conflicting with operator-owned generated secrets.
    initialAdminPasswordSecretRef:
      name: automation-orchestrator-initial-admin-password
  ingress:
    host: __INGRESS_HOST__
    type: Route
  postgres:
    backendDatabase:
      secretRef:
        name: orchestrator-postgres-secret
    caCertSecretRef:
      name: orchestrator-postgres-ca
    # The full Service name: Temporal checks it against the service-ca certificate.
    host: orchestrator-postgres-rw.__NAMESPACE__.svc
    port: 5432
    sslMode: verify-ca
    temporalDatabase:
      secretRef:
        name: temporal-postgres-secret
