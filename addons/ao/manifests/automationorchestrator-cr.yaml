#   __INGRESS_HOST__      -> route hostname
#   __PULL_SECRET_NAME__  -> registry pull secret (addon addition; not in aapctl output)
---
apiVersion: aap.ansible.com/v1alpha1
kind: AutomationOrchestrator
metadata:
  name: automation-orchestrator
  namespace: __NAMESPACE__
spec:
  imagePullSecrets:
    - name: __PULL_SECRET_NAME__
  ingress:
    host: __INGRESS_HOST__
    type: Route
  postgres:
    backendDatabase:
      secretRef:
        name: orchestrator-postgres-secret
    caCertSecretRef:
      name: orchestrator-postgres-ca
    host: orchestrator-postgres-rw
    port: 5432
    sslMode: verify-ca
    temporalDatabase:
      secretRef:
        name: temporal-postgres-secret
