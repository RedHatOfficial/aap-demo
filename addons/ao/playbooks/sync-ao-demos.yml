- name: Prepare TMM workflow synchronization
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ao_api_url: "http://automation-orchestrator-backend.automation-orchestrator.svc.cluster.local:8000/api/v1"
    ao_api_host: ""
    ao_demo_repository: "https://github.com/ansible-tmm/aap-orchestrator-demos"
    ao_demo_ref: "abcc1a1482a"
    ao_demo_source: "{{ ao_demo_repository.rstrip('/') }}/archive/{{ ao_demo_ref }}.tar.gz"
    ao_demo_project_id: ""
    ao_aap_credential_id: ""
    ao_aap_integration_id: ""
    ao_agent_credential_id: ""
    ao_agent_model_id: ""
    ao_mcp_integration_id: ""
    ao_mcp_credential_id: ""
  pre_tasks:
    - name: Validate required AO variables
      ansible.builtin.assert:
        that:
          - ao_api_token | length > 0
          - ao_api_host | length > 0
          - ao_aap_credential_id | length > 0
          - ao_aap_integration_id | length > 0
        fail_msg: >-
          ao_api_token, ao_api_host, ao_aap_credential_id, and
          ao_aap_integration_id are required. Pass them as AAP extra variables
          or through a credential.
      no_log: true

    - name: Find the AO project for imported workflows
      ansible.builtin.uri:
        url: "{{ ao_api_url }}/projects?limit=100"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_api_token }}"
          Host: "{{ ao_api_host }}"
        validate_certs: false
        use_proxy: false
        return_content: true
      register: __ao_projects
      no_log: true
      failed_when: false
      until: __ao_projects.status | default(0) == 200
      retries: 30
      delay: 5

    - name: Validate AO project lookup
      ansible.builtin.assert:
        that:
          - __ao_projects.status | default(0) == 200
        fail_msg: >-
          AO project lookup failed from AAP (url={{ ao_api_url }};
          host={{ ao_api_host }};
          status={{ __ao_projects.status | default('unreachable') }};
          error={{ __ao_projects.msg | default('unknown error') }}).

    - name: Select the target AO project
      ansible.builtin.set_fact:
        ao_demo_project_id: >-
          {{ ao_demo_project_id
             or ((__ao_projects.json.resources | default(__ao_projects.json.results | default([])))
                 | selectattr('is_default', 'equalto', true)
                 | map(attribute='id') | first | default('')) }}

    - name: Require a target AO project
      ansible.builtin.assert:
        that:
          - ao_demo_project_id | length > 0
        fail_msg: "AO has no default project and ao_demo_project_id was not provided."

    - name: Create temporary source directory
      ansible.builtin.tempfile:
        state: directory
        prefix: aap-ao-demos-
      register: __ao_temp_dir

    - name: Download the pinned TMM demo archive
      ansible.builtin.get_url:
        url: "{{ ao_demo_source }}"
        dest: "{{ __ao_temp_dir.path }}/demos.tar.gz"
        mode: "0600"
        checksum: "{{ ao_demo_checksum | default(omit) }}"
      register: __ao_archive

    - name: Extract the TMM demo archive
      ansible.builtin.unarchive:
        src: "{{ __ao_archive.dest }}"
        dest: "{{ __ao_temp_dir.path }}"
        remote_src: true

    - name: Locate upstream AO workflow exports
      ansible.builtin.find:
        paths: "{{ __ao_temp_dir.path }}"
        patterns: "*.json"
        recurse: true
        file_type: file
      register: __ao_workflow_files

    - name: Keep only AO workflow exports
      ansible.builtin.set_fact:
        __ao_sources: >-
          {{ __ao_workflow_files.files
             | selectattr('path', 'search', '/ao/')
             | sort(attribute='path')
             | list }}

    - name: Ensure upstream exports were found
      ansible.builtin.assert:
        that:
          - __ao_sources | length > 0
        fail_msg: "No AO workflow JSON files were found in the upstream archive."

    - name: Read upstream workflow names
      ansible.builtin.set_fact:
        __ao_source_names: >-
          {{ __ao_source_names | default([])
             + [__ao_name_document.name | default(__ao_name_source.path | basename | splitext | first)] }}
      loop: "{{ __ao_sources }}"
      loop_control:
        loop_var: __ao_name_source
      vars:
        __ao_name_document: "{{ lookup('file', __ao_name_source.path) | from_json }}"

  tasks:
    - name: Add one isolated worker host per AO workflow export
      ansible.builtin.add_host:
        name: "ao_workflow_worker_{{ __ao_worker_index }}"
        groups: ao_workflow_workers
        ansible_connection: local
        ao_sync_source: "{{ __ao_worker_source }}"
        ao_sync_source_names: "{{ __ao_source_names }}"
        ao_api_url: "{{ ao_api_url }}"
        ao_api_host: "{{ ao_api_host }}"
        ao_api_token: "{{ ao_api_token }}"
        ao_demo_project_id: "{{ ao_demo_project_id }}"
        ao_aap_credential_id: "{{ ao_aap_credential_id }}"
        ao_aap_integration_id: "{{ ao_aap_integration_id }}"
        ao_agent_credential_id: "{{ ao_agent_credential_id }}"
        ao_agent_model_id: "{{ ao_agent_model_id }}"
        ao_mcp_integration_id: "{{ ao_mcp_integration_id }}"
        ao_mcp_credential_id: "{{ ao_mcp_credential_id }}"
      loop: "{{ __ao_sources }}"
      loop_control:
        loop_var: __ao_worker_source
        index_var: __ao_worker_index
        label: "{{ __ao_worker_source.path | basename }}"
      no_log: true

- name: Synchronize AO workflows concurrently
  hosts: ao_workflow_workers
  connection: local
  gather_facts: false
  strategy: free
  tasks:
    - name: Synchronize this AO workflow export
      ansible.builtin.include_tasks: tasks/sync_workflow.yml
      vars:
        __ao_source: "{{ ao_sync_source }}"
        __ao_source_names: "{{ ao_sync_source_names }}"

- name: Remove temporary AO workflow source directory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove temporary source directory
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['__ao_temp_dir'].path | default('') }}"
        state: absent
      when: hostvars['localhost']['__ao_temp_dir'] is defined
