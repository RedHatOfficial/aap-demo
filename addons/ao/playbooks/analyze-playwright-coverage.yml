---
- name: Analyze AAP-UI Playwright integration coverage
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ao_repository: "{{ repository | default('ansible/ansible-ui', true) }}"
    ao_ref: "{{ ref | default('devel', true) }}"
    ao_test_path: "{{ test_path | default('playwright/tests/integration', true) }}"
    ao_source_name: "{{ source_label | default('AAP-UI Playwright integration tests', true) }}"
    ao_archive_url: "https://github.com/{{ ao_repository }}/archive/{{ ao_ref }}.tar.gz"
    ao_archive_file: "/tmp/aap-ui-playwright-source.tar.gz"
    ao_source_root: "/tmp/aap-ui-playwright-source"
    ao_analyzer: "{{ playbook_dir }}/../scripts/analyze-playwright-coverage.py"
    ao_deployment_areas: "{{ deployment_areas | default('authentication,controller,execution,gateway,hub,eda,permissions,failure handling', true) }}"
  tasks:
    - name: Download AAP-UI source archive
      ansible.builtin.get_url:
        url: "{{ ao_archive_url }}"
        dest: "{{ ao_archive_file }}"
        mode: "0600"

    - name: Extract AAP-UI source archive
      ansible.builtin.file:
        path: "{{ ao_source_root }}"
        state: directory
        mode: "0700"

    - name: Unpack AAP-UI source archive
      ansible.builtin.unarchive:
        src: "{{ ao_archive_file }}"
        dest: "{{ ao_source_root }}"
        remote_src: true

    - name: Run deterministic coverage analyzer
      ansible.builtin.command:
        argv:
          - python3
          - "{{ ao_analyzer }}"
          - --source-root
          - "{{ ao_source_root }}"
          - --include-path
          - "{{ ao_test_path }}"
          - --source-name
          - "{{ ao_source_name }}"
          - --deployment-areas
          - "{{ ao_deployment_areas }}"
      register: ao_analysis
      changed_when: false

    - name: Publish coverage report as job artifact
      ansible.builtin.set_stats:
        data:
          aap_ui_coverage_report: "{{ ao_analysis.stdout | from_json }}"
        per_host: false

    - name: Show coverage report
      ansible.builtin.debug:
        msg: "{{ ao_analysis.stdout }}"
